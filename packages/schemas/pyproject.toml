[project]
name = "classifyre-schemas"
version = "0.5.6"
description = "Shared JSON schemas for Classifyre monorepo"
# Kept in sync with apps/cli: both ship in the same images on the same
# interpreter, and an unbounded range breaks `uv lock` / Dependabot updates
# (see the note on requires-python in apps/cli/pyproject.toml).
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastjsonschema==2.22.2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]
