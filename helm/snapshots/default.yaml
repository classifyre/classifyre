# Source: classifyre-core/templates/postgres-embedded.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifyre-postgres
  labels:
    app.kubernetes.io/name: classifyre
    helm.sh/chart: classifyre-core-0.7.5-SNAPSHOT
    app.kubernetes.io/instance: classifyre
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: classifyre
      app.kubernetes.io/instance: classifyre
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classifyre
        app.kubernetes.io/instance: classifyre
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      priorityClassName: "classifyre-service-standard"
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg18-bookworm
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - "shared_buffers=512MB"
            - -c
            - "work_mem=16MB"
          ports:
            - name: pg
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "classifyre"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classifyre-db
                  key: password
          # Readiness is the safe probe: a failure only parks traffic, it never
          # kills the process. The thresholds are still generous, because a
          # flapping ready state churns every consumer's connection pool.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Parallel query workers allocate their exchange buffers in /dev/shm.
        # The container runtime's 64Mi default makes large parallel aggregates
        # fail with SQLSTATE 53100 ("could not resize shared memory segment").
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: postgres-data
          persistentVolumeClaim:
            claimName: classifyre-postgres-data
