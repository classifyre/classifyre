# Source: classifyre-core/templates/iam-setup-job.yaml
# One job per release revision: a new revision gets a new job (and the old one
# leaves with the old manifest), without making `helm upgrade` wait for the
# identity server the way a hook would.
apiVersion: batch/v1
kind: Job
metadata:
  name: classifyre-iam-setup-1
  labels:
    app.kubernetes.io/name: classifyre
    helm.sh/chart: classifyre-core-0.7.5-SNAPSHOT
    app.kubernetes.io/instance: classifyre
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: iam-setup
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classifyre
        app.kubernetes.io/instance: classifyre
        app.kubernetes.io/component: iam-setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: setup
          image: quay.io/keycloak/keycloak:26.8.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/setup/setup-realm.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
