# Source: classifyre-core/templates/iam-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifyre-iam
  labels:
    app.kubernetes.io/name: classifyre
    helm.sh/chart: classifyre-core-0.7.5-SNAPSHOT
    app.kubernetes.io/instance: classifyre
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: iam
spec:
  replicas: 1
  # Minor upgrades of the identity server need every node stopped; patch
  # upgrades would allow a rolling update, but one strategy that is always
  # safe beats one that is right most of the time. Issued tokens stay valid
  # meanwhile: the API checks them against keys it has cached.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: classifyre
      app.kubernetes.io/instance: classifyre
      app.kubernetes.io/component: iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classifyre
        app.kubernetes.io/instance: classifyre
        app.kubernetes.io/component: iam
      annotations:
        checksum/secret: <generated>
        # Keycloak caches themes: a changed theme needs a restart to show.
        checksum/theme: 8416966d736bfac9e304c377a9ae343a868fb5400966f989069e29ec6f45f17d
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
      initContainers:
        # The embedded PostgreSQL runs as a superuser, so the chart can give
        # the identity server its own role and database on it. Idempotent:
        # runs on every start and keeps the role's password in step with the
        # Secret.
        - name: iam-database
          image: pgvector/pgvector:0.8.7-pg18-bookworm
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
          env:
            - name: PGHOST
              value: "classifyre-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGDATABASE
              value: "classifyre"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: classifyre-db
                  key: password
            - name: IAM_DB_NAME
              value: "iam"
            - name: IAM_DB_USER
              value: "iam"
            - name: IAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classifyre-iam
                  key: password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -q; do echo "waiting for PostgreSQL"; sleep 2; done
              if [ -z "$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '${IAM_DB_USER}'")" ]; then
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"${IAM_DB_USER}\" LOGIN"
              fi
              psql -v ON_ERROR_STOP=1 -c "ALTER ROLE \"${IAM_DB_USER}\" WITH LOGIN PASSWORD '${IAM_DB_PASSWORD}'"
              if [ -z "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${IAM_DB_NAME}'")" ]; then
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${IAM_DB_NAME}\" OWNER \"${IAM_DB_USER}\""
              fi
      containers:
        - name: iam
          image: quay.io/keycloak/keycloak:26.8.1
          imagePullPolicy: IfNotPresent
          args: ["start"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: "classifyre-postgres"
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              value: "iam"
            - name: KC_DB_USERNAME
              value: "iam"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classifyre-iam
                  key: password
            - name: KC_DB_POOL_MAX_SIZE
              value: "20"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/iam"
            # Browsers and token issuers use the public URL; the API reaches
            # the server in-cluster, and backchannel URLs follow the request.
            - name: KC_HOSTNAME
              value: "http://snapshot.example.com/iam"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
            # Administrator of the identity server itself, created on first
            # start in its own master realm; only the realm setup job uses it.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: classifyre-iam
                  key: admin-password
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
            - name: jgroups
              containerPort: 7800
          startupProbe:
            httpGet:
              path: /iam/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /iam/health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /iam/health/live
              port: management
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            # Classifyre's theme, as plain files: the image stays the stock one.
            - name: theme
              mountPath: /opt/keycloak/themes/classifyre
              readOnly: true
          resources:
            limits:
              memory: 1536Mi
            requests:
              cpu: 250m
              memory: 768Mi
      volumes:
        - name: theme
          configMap:
            name: classifyre-iam-theme
            items:
              
              - key: account__theme.properties
                path: account/theme.properties
              - key: admin__theme.properties
                path: admin/theme.properties
              - key: login__resources__css__login.css
                path: login/resources/css/login.css
              - key: login__resources__img__board.svg
                path: login/resources/img/board.svg
              - key: login__theme.properties
                path: login/theme.properties
              - key: shared__css__brand.css
                path: login/resources/css/brand.css
              - key: shared__css__brand.css
                path: admin/resources/css/brand.css
              - key: shared__css__brand.css
                path: account/resources/css/brand.css
              - key: shared__css__console.css
                path: login/resources/css/console.css
              - key: shared__css__console.css
                path: admin/resources/css/console.css
              - key: shared__css__console.css
                path: account/resources/css/console.css
              - key: shared__fonts__LICENSE.txt
                path: login/resources/fonts/LICENSE.txt
              - key: shared__fonts__LICENSE.txt
                path: admin/resources/fonts/LICENSE.txt
              - key: shared__fonts__LICENSE.txt
                path: account/resources/fonts/LICENSE.txt
              - key: shared__fonts__archivo-black-latin.woff2
                path: login/resources/fonts/archivo-black-latin.woff2
              - key: shared__fonts__archivo-black-latin.woff2
                path: admin/resources/fonts/archivo-black-latin.woff2
              - key: shared__fonts__archivo-black-latin.woff2
                path: account/resources/fonts/archivo-black-latin.woff2
              - key: shared__fonts__ibm-plex-mono-400-latin.woff2
                path: login/resources/fonts/ibm-plex-mono-400-latin.woff2
              - key: shared__fonts__ibm-plex-mono-400-latin.woff2
                path: admin/resources/fonts/ibm-plex-mono-400-latin.woff2
              - key: shared__fonts__ibm-plex-mono-400-latin.woff2
                path: account/resources/fonts/ibm-plex-mono-400-latin.woff2
              - key: shared__fonts__ibm-plex-mono-600-latin.woff2
                path: login/resources/fonts/ibm-plex-mono-600-latin.woff2
              - key: shared__fonts__ibm-plex-mono-600-latin.woff2
                path: admin/resources/fonts/ibm-plex-mono-600-latin.woff2
              - key: shared__fonts__ibm-plex-mono-600-latin.woff2
                path: account/resources/fonts/ibm-plex-mono-600-latin.woff2
              - key: shared__fonts__ibm-plex-sans-latin.woff2
                path: login/resources/fonts/ibm-plex-sans-latin.woff2
              - key: shared__fonts__ibm-plex-sans-latin.woff2
                path: admin/resources/fonts/ibm-plex-sans-latin.woff2
              - key: shared__fonts__ibm-plex-sans-latin.woff2
                path: account/resources/fonts/ibm-plex-sans-latin.woff2
              - key: shared__img__favicon.ico
                path: login/resources/img/favicon.ico
              - key: shared__img__favicon.ico
                path: admin/resources/img/favicon.ico
              - key: shared__img__favicon.ico
                path: account/resources/img/favicon.ico
              - key: shared__img__logo.png
                path: login/resources/img/logo.png
              - key: shared__img__logo.png
                path: admin/resources/img/logo.png
              - key: shared__img__logo.png
                path: account/resources/img/logo.png
