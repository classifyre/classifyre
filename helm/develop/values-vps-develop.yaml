# VPS develop values
# Same single-node K3s setup as values-vps.yaml, but deployed to the
# classifyre-develop namespace on NodePort 30101 with :develop image tags.
# Access: https://staging.classifyre.com/
#
# Develop shares the node with prod (see the budget in values-vps.yaml) and
# is parked between test runs: api/web are scaled to 0 with their HPAs
# removed (scale-down step in .github/workflows/develop.yml). Postgres and
# worker stay up but on reduced requests below, so the prod namespace always
# has room to schedule a scan. Develop postgres idles at ~50Mi, worker at
# ~180Mi — neither needs the full-footprint defaults.

api:
  image:
    repository: classifyre/api
    tag: "develop"
    pullPolicy: Always

  env:
    DEMO_MODE: "false"
    MAX_CONCURRENT_RUNNERS: "1"

  # Single-node VPS: minimal footprint.
  autoscaling:
    minReplicas: 1
    maxReplicas: 1

  cliJobs:
    image:
      repository: classifyre/cli
      tag: "develop"
      pullPolicy: Always
    runnerLogs:
      accessModes:
        - ReadWriteOnce


frontend:
  image:
    repository: classifyre/web
    tag: "develop"
    pullPolicy: Always

  autoscaling:
    minReplicas: 1
    maxReplicas: 1
  posthog:
    enabled: true
    token: "phc_ocaaqUW6YaGFTFqKTvydnaEHmouSWnHnTuKuPQtjmfLe"
    host: "/classifyre-usr"
    uiHost: "https://eu.posthog.com"
    ingestHost: "https://eu.i.posthog.com"

  service:
    type: NodePort
    port: 3100
    nodePort: 30101

ingress:
  enabled: false

postgres:
  mode: embedded
  embedded:
    existingSecret: classifyre-develop-postgres-credentials
    persistence:
      accessModes:
        - ReadWriteOnce
    # Shared-node diet: the chart default reserves 4Gi (request == limit for
    # Guaranteed QoS), which the idle develop DB never uses. Requests only —
    # limits stay at the chart default so test-time spikes still have
    # headroom. This changes scheduler placement, not runtime caps.
    resources:
      requests:
        cpu: 500m
        memory: 512Mi

worker:
  # Same shared-node diet as postgres above. Requests only; limits stay at
  # the chart default.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

telemetry:
  enabled: true
  otlpEndpoint: "http://otel-receiver-opentelemetry-collector.monitoring:4318"

objectStorage:
  enabled: false
