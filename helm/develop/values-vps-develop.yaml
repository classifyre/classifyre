# VPS develop values
# Same single-node K3s setup as values-vps.yaml, but deployed to the
# classifyre-develop namespace on NodePort 30101 with :develop image tags.
# Access: https://staging.classifyre.com/
#
# This is the smoke deploy (.github/workflows/develop.yml): installed fresh
# with sign-in on, seeded (scripts/smoke/seed.sh), checked by the Playwright
# smoke test (apps/e2e), then destroyed with its database
# (scripts/smoke/destroy.sh), so nothing stays on the shared node.
#
# Develop shares the node with prod (see the budget in values-vps.yaml).
# While a run is up, Postgres and the worker run on reduced requests below, so
# the prod namespace keeps room to schedule a scan.

api:
  image:
    repository: classifyre/api
    tag: "develop"
    pullPolicy: Always

  env:
    DEMO_MODE: "false"
    MAX_CONCURRENT_RUNNERS: "1"

  # Single-node VPS: minimal footprint.
  autoscaling:
    minReplicas: 1
    maxReplicas: 1

  # The smoke test's folder, from the ConfigMap scripts/smoke/seed.sh makes.
  localFolders:
    - name: smoke
      mountPath: /mnt/corpora/smoke
      configMap:
        name: classifyre-smoke-fixture
        optional: true

  cliJobs:
    image:
      repository: classifyre/cli
      tag: "develop"
      pullPolicy: Always
    runnerLogs:
      accessModes:
        - ReadWriteOnce
    # Each smoke run starts empty, so a dependency cache would never be warm,
    # and its claim binds only when the first scan job uses it, which keeps
    # `helm --wait` from ever finishing on a fresh install.
    uvCache:
      enabled: false
    # The smoke scan reads one small file with the secrets detector. The chart's
    # 4Gi request (sized for real corpora and ML detectors) does not fit next
    # to a prod scan on the shared node; the request is what the scheduler
    # counts, so keep it small and leave the limit some room.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
        ephemeral-storage: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 6Gi


frontend:
  image:
    repository: classifyre/web
    tag: "develop"
    pullPolicy: Always

  autoscaling:
    minReplicas: 1
    maxReplicas: 1
  posthog:
    enabled: true
    token: "phc_ocaaqUW6YaGFTFqKTvydnaEHmouSWnHnTuKuPQtjmfLe"
    host: "/classifyre-usr"
    uiHost: "https://eu.posthog.com"
    ingestHost: "https://eu.i.posthog.com"

  service:
    type: NodePort
    port: 3100
    nodePort: 30101

ingress:
  enabled: false

postgres:
  mode: embedded
  embedded:
    existingSecret: classifyre-develop-postgres-credentials
    persistence:
      accessModes:
        - ReadWriteOnce
    # Shared-node diet: the chart default reserves 4Gi (request == limit for
    # Guaranteed QoS), which the idle develop DB never uses. Requests only —
    # limits stay at the chart default so test-time spikes still have
    # headroom. This changes scheduler placement, not runtime caps.
    resources:
      requests:
        cpu: 500m
        memory: 512Mi

worker:
  # Same shared-node diet as postgres above. Requests only; limits stay at
  # the chart default.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

telemetry:
  enabled: true
  otlpEndpoint: "http://otel-receiver-opentelemetry-collector.monitoring:4318"

objectStorage:
  enabled: false

# Sign-in on: the smoke test signs in, creates a workspace and checks access.
# The web app proxies the identity server at /iam on the same host. A public
# tenant next to `default`, so the smoke test checks that visitors see it and
# signed-in people of `default` never do.
iam:
  enabled: true
  appUrl: https://staging.classifyre.com
  public:
    enabled: true
    tenant: public
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
