# Sign-in on the k3d dev stack. Added by the `iam` skaffold profile:
#   CLASSIFYRE_IAM=true ./scripts/dev/start.sh
# The web app is not deployed in-cluster for local dev (`frontend.enabled:
# false`), so the browser cannot use the ingress for sign-in: no ingress
# routes `/iam` without the web service behind it. Instead the browser opens
# the web server on your machine, whose `/iam/[...path]` route proxies to the
# identity server — so the public URL and the app URL are both localhost:3000,
# and the issuer in tokens is the host the browser actually sees.
iam:
  enabled: true
  appUrl: http://localhost:3000
  # Dev only: the identity server's own admin console at
  # http://localhost:3000/iam/admin (user `admin`, password in the
  # classifyre-iam Secret, key admin-password).
  exposeAdminConsole: true
  database:
    poolMaxSize: 5
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
