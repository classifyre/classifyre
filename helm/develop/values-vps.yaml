# VPS demo/test values
# Single-node K3s, no ingress, NodePort access for web only.
# API remains ClusterIP — Next.js proxies /api calls server-side.
# Access: https://demo.classifyre.com

api:
  image:
    repository: classifyre/api
    tag: "main"
    pullPolicy: Always

  env:
    # Public instance: read-only for visitors. Scheduled scans, the CLI's
    # write-backs and the autopilot agents are unaffected — CLI jobs present the
    # internal API key (api.internalApiKey, generated by the chart) and the
    # agents run in-process. To make changes to this instance, run a local
    # writable cluster against this same database:
    #   ./scripts/dev/start-vps-db.sh
    DEMO_MODE: "true"
    # Single-node VPS: node has ~11.4Gi allocatable memory. The chart now
    # sizes CLI jobs at 4Gi request == limit and embedded Postgres at 4Gi
    # request == limit (Guaranteed), so the steady-state budget is:
    #   postgres 4Gi + api 768Mi + worker 512Mi + web 2x384Mi (~6.1Gi)
    #   + one extract job 4Gi = ~10.1Gi, leaving ~1Gi headroom.
    # The develop release shares this same node and is therefore kept on a
    # diet (see values-vps-develop.yaml) — two full-footprint stacks (two
    # 4Gi Postgres reservations) leave no room for any job and every scan
    # sits Pending. That is what happened on 2026-09-10.
    MAX_CONCURRENT_RUNNERS: "1"
    # Backpressure strategy (see chart values `api.maxOldSpaceSizeMb`):
    #   * Heap guard: left at the chart default (85% of the JS heap cap). Now
    #     that the heap is raised to 1536 MB inside a 2Gi pod, the guard sheds
    #     ingestion (CLI 503 → retry, never lost) BEFORE V8 hard-crashes.
    #     Previously this was disabled because the old 1Gi/512 MB-heap pods sat
    #     permanently near the limit and the guard false-fired on every request.
    #   * RSS guard: still disabled — native onnxruntime/embedding memory makes
    #     RSS noisy, and the heap + event-loop signals cover the real failures.
    #   * Event-loop delay (2 s): fires only when Node is CPU-starved.
    # DB-level backpressure (P2028/P2034 → 503) is handled by PrismaExceptionFilter.
    UNDER_PRESSURE_MAX_RSS_BYTES: "0" # 0 = disabled
    UNDER_PRESSURE_MAX_EVENT_LOOP_DELAY: "2000" # 2 s event-loop lag = genuinely stuck

  # Single-node VPS: cap replicas so CLI jobs don't trigger runaway HPA scale-out.
  # 10 API pods on one node causes memory pressure → liveness probe failures →
  # RemoteDisconnected errors mid-request → asset failures.
  #
  # maxReplicas is 1, not 2: a second API pod (+768Mi request) on its own
  # consumes the whole extract-job headroom below, and the HPA latches onto
  # it — 2 pods idling at ~40% each never average below the 75% memory
  # target, so it never scales back and every new scan sits Pending
  # (observed 2026-09-11). One API pod idles at ~300Mi and handled prod
  # alone for months; the CLI write-backs retry across the rolling restart.
  autoscaling:
    minReplicas: 1
    maxReplicas: 1

  cliJobs:
    image:
      repository: classifyre/cli
      tag: "main"
      pullPolicy: Always

frontend:
  image:
    repository: classifyre/web
    tag: "main"
    pullPolicy: IfNotPresent
  posthog:
    enabled: true
    token: "phc_ocaaqUW6YaGFTFqKTvydnaEHmouSWnHnTuKuPQtjmfLe"
    host: "/classifyre-usr"
    uiHost: "https://eu.posthog.com"
    ingestHost: "https://eu.i.posthog.com"
  googleAnalytics:
    enabled: true
    measurementId: "G-0RLFLNZDPP"

  # Public instance reachable from the EU without any contract, and it runs
  # both PostHog and GA — so it is the one deployment that has to ask before
  # either of them loads.
  cookieConsent:
    enabled: true
    policyUrl: "https://www.classifyre.com/privacy/"

  # This instance is deliberately public (read-only demo), so it is the one
  # deployment that publishes a sitemap and invites crawlers. URLs are built
  # from the request's forwarded host, which is https://demo.classifyre.com
  # behind the node's reverse proxy — set `baseUrl` here if that ever stops
  # being what reaches the pod.
  sitemap:
    enabled: true

  service:
    type: NodePort
    port: 3100
    nodePort: 30100

ingress:
  enabled: false

postgres:
  mode: embedded
  embedded:
    existingSecret: classifyre-postgres-password
    persistence:
      accessModes:
        - ReadWriteOnce

telemetry:
  enabled: true
  otlpEndpoint: "http://otel-receiver-opentelemetry-collector.monitoring:4318"

objectStorage:
  enabled: false
  bucket: classifyredemologs
  endpoint: "https://s3.us-west-002.backblazeb2.com"
  region: us-west-002
  forcePathStyle: false
  existingSecret: classifyre-s3-credentials
