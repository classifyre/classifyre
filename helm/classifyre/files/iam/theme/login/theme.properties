# Classifyre's sign-in pages: Keycloak's own (keycloak.v2) with the brand on
# top. Mounted from a ConfigMap by the chart (templates/iam-theme-configmap.yaml);
# the server image stays the stock one.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/brand.css css/login.css

# Always the black signal panel, like the landing's hero: the dark PatternFly
# palette is switched on for good instead of following the system setting.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark
