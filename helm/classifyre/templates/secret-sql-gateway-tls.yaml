{{- if and .Values.sqlGateway.enabled (not .Values.sqlGateway.tls.existingSecret) }}
{{- $name := include "classifyre.sqlGateway.tlsSecret" . }}
{{- $service := include "classifyre.sqlGateway.fullname" . }}
{{- $hosts := list $service (printf "%s.%s.svc" $service .Release.Namespace) (printf "%s.%s.svc.cluster.local" $service .Release.Namespace) "localhost" }}
{{- with .Values.sqlGateway.publicHost }}{{- $hosts = prepend $hosts . }}{{- end }}
{{- $hosts = concat $hosts .Values.sqlGateway.tls.extraSans }}
{{- if .Values.sqlGateway.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: sql-gateway
spec:
  secretName: {{ $name }}
  dnsNames:
    {{- toYaml (uniq $hosts) | nindent 4 }}
  issuerRef:
    {{- toYaml .Values.sqlGateway.tls.certManager.issuerRef | nindent 4 }}
{{- else }}
{{- /*
No certificate given: the chart makes a CA and a certificate for the gateway's
names once, and keeps them (lookup) so clients that trust the CA keep working
across upgrades. Delete the Secret to make new ones (after a publicHost change).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: sql-gateway
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
{{- if and $existing (index $existing.data "tls.crt") }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  ca.crt: {{ index $existing.data "ca.crt" | default "" }}
{{- else }}
{{- $ca := genCA "Classifyre SQL gateway CA" 3650 }}
{{- $cert := genSignedCert (first (uniq $hosts)) (list "127.0.0.1") (uniq $hosts) 825 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
{{- end }}
