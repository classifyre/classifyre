{{- if and (include "classifyre.queryWorker.enabled" .) (not .Values.queryWorker.token.existingSecret) }}
{{- $secretName := include "classifyre.queryWorker.tokenSecretName" . -}}
{{- $secretKey := include "classifyre.queryWorker.tokenSecretKey" . -}}
{{- /* The token the API signs query-worker requests with. Kept across
     `helm upgrade` (read back from the cluster), generated once otherwise. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $value := "" -}}
{{- if and $existing (hasKey $existing.data $secretKey) -}}
{{- $value = index $existing.data $secretKey | b64dec -}}
{{- end -}}
{{- $value = $value | default .Values.queryWorker.token.value | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-worker
type: Opaque
stringData:
  {{ $secretKey }}: {{ $value | quote }}
{{- end }}
