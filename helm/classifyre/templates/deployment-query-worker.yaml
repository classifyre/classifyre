{{- if include "classifyre.queryWorker.enabled" . }}
{{- /*
Query worker (docs/prd/DQ-data-query.md §5.3): the CLI image running
`query-worker`, a warm host that forks one process per SQL query, so a query
does not wait for a Job's pod to start. The API (and the SQL gateway) send it
the request they would put in a query Job; a query it cannot take (every slot
busy, draining) runs as a Job.

It holds what a query Job holds and nothing more: no service-account token, no
API key; each query process sees only its own request's credentials. Queries
of every workspace share these pods, so they run tighter than a Job: a
read-only root filesystem (nothing a query does can change the code later
queries run), the token as a file, and a NetworkPolicy of their own.
*/ -}}
{{- $cli := .Values.api.cliJobs -}}
{{- $qw := .Values.queryWorker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "classifyre.queryWorker.fullname" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-worker
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $qw.autoscaling.enabled }}
  replicas: {{ $qw.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A new pod warms up before an old one drains: no moment without a worker.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "classifyre.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: query-worker
  template:
    metadata:
      labels:
        {{- include "classifyre.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: query-worker
        {{- with $qw.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $qw.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with (include "classifyre.priorityClassName" (dict "name" $qw.priorityClassName "root" .)) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      # preStop (endpoint removal) + drain + margin.
      terminationGracePeriodSeconds: {{ add (int $qw.drainSeconds) 20 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Never without one: blanked values fall back to these. */}}
      securityContext:
        {{- toYaml ($qw.podSecurityContext | default (dict "runAsNonRoot" true "runAsUser" 10001 "runAsGroup" 10001 "fsGroup" 10001 "seccompProfile" (dict "type" "RuntimeDefault"))) | nindent 8 }}
      containers:
        - name: query-worker
          image: "{{ $cli.image.repository }}:{{ $cli.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $cli.image.pullPolicy }}
          # The image's entrypoint is `python -m src.main`.
          args: ["query-worker"]
          workingDir: {{ $cli.workDir | quote }}
          ports:
            - name: http
              containerPort: {{ $qw.port }}
              protocol: TCP
          env:
            - name: CLASSIFYRE_QUERY_WORKER_TOKEN_FILE
              value: {{ include "classifyre.queryWorker.tokenFile" . | quote }}
            - name: CLASSIFYRE_QUERY_WORKER_PORT
              value: {{ $qw.port | quote }}
            - name: CLASSIFYRE_QUERY_WORKER_SLOTS
              value: {{ $qw.slots | quote }}
            {{- with (include "classifyre.memQuantityMb" $qw.memoryPerQuery) }}
            - name: CLASSIFYRE_QUERY_WORKER_MEMORY_PER_QUERY_MB
              value: {{ . | quote }}
            {{- end }}
            {{- with (include "classifyre.memQuantityMb" $qw.maxMemoryPerQuery) }}
            - name: CLASSIFYRE_QUERY_WORKER_MAX_QUERY_MEMORY_MB
              value: {{ . | quote }}
            {{- end }}
            - name: CLASSIFYRE_QUERY_WORKER_MEMORY_GUARD_PERCENT
              value: {{ $qw.memoryGuardPercent | quote }}
            - name: CLASSIFYRE_QUERY_WORKER_JOB_ONLY_SOURCES
              value: {{ join "," $qw.jobOnlySourceTypes | quote }}
            - name: CLASSIFYRE_QUERY_WORKER_DRAIN_SECONDS
              value: {{ $qw.drainSeconds | quote }}
            - name: CLASSIFYRE_QUERY_WORKER_WORKSPACE_SHARE_PERCENT
              value: {{ $qw.workspaceSharePercent | quote }}
            - name: CLASSIFYRE_QUERY_WORKER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Local sources may only lie in the mounted folders.
            - name: CLASSIFYRE_QUERY_LOCAL_ROOTS
              value: {{ include "classifyre.localFolders.mountPaths" . | quote }}
            {{- with $cli.query.maxSpill }}
            - name: CLASSIFYRE_QUERY_MAX_SPILL
              value: {{ . | quote }}
            {{- end }}
            # Everything a query imports is in the image (and the root
            # filesystem is read-only): nothing to install while queries run.
            - name: CLASSIFYRE_CLI_AUTO_INSTALL_OPTIONAL_DEPS
              value: "0"
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: TELEMETRY_DISABLED
              value: "1"
            {{- /* The worker passes queries only an allowlisted environment;
                 what an operator adds below is kept on purpose. */}}
            {{- $extra := list }}
            {{- range (concat ($cli.extraEnv | default list) ($qw.extraEnv | default list)) }}
            {{- $extra = append $extra .name }}
            {{- end }}
            {{- if $extra }}
            - name: CLASSIFYRE_QUERY_WORKER_ENV_ALLOW
              value: {{ join "," $extra | quote }}
            {{- end }}
            {{- with $cli.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $qw.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # The only writable path: each query's own directory under it
            # (spill files, CA bundles, an export), removed when it ends.
            - name: tmp
              mountPath: /tmp
            {{- include "classifyre.queryWorker.tokenMount" . | trim | nindent 12 }}
            {{- with $cli.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- range .Values.api.localFolders }}
            - name: local-folder-{{ .name }}
              mountPath: {{ .mountPath | quote }}
              readOnly: {{ ne .readOnly false }}
            {{- end }}
          {{- with $qw.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            # The fork server imports DuckDB and every source once: seconds.
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the Service drop this pod before it stops taking queries.
              exec:
                command: ["sleep", "5"]
          securityContext:
            {{- toYaml ($qw.containerSecurityContext | default (dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")))) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            {{- with $qw.tmpSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- include "classifyre.queryWorker.tokenVolume" . | trim | nindent 8 }}
        {{- with $cli.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- range .Values.api.localFolders }}
        - {{ merge (dict "name" (printf "local-folder-%s" .name)) (omit . "name" "mountPath" "readOnly") | toJson }}
        {{- end }}
      {{- with ($qw.nodeSelector | default $cli.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($qw.tolerations | default $cli.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $qw.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "classifyre.queryWorker.fullname" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-worker
spec:
  type: ClusterIP
  selector:
    {{- include "classifyre.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-worker
  ports:
    - name: http
      port: {{ $qw.port }}
      targetPort: http
      protocol: TCP
{{- if or (gt (int $qw.replicaCount) 1) (and $qw.autoscaling.enabled (gt (int $qw.autoscaling.minReplicas) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "classifyre.queryWorker.fullname" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "classifyre.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: query-worker
{{- end }}
{{- if $qw.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "classifyre.queryWorker.fullname" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "classifyre.queryWorker.fullname" . }}
  minReplicas: {{ $qw.autoscaling.minReplicas }}
  maxReplicas: {{ $qw.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $qw.autoscaling.targetCPUUtilizationPercentage }}
    {{- with $qw.autoscaling.extraMetrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      # A pod leaving drains its queries; do not shed pods on a short lull.
      stabilizationWindowSeconds: {{ $qw.autoscaling.scaleDownStabilizationSeconds }}
{{- end }}
{{- if and (include "classifyre.queryWorker.enabled" .) .Values.queryWorker.networkPolicy.enabled }}
{{- /* Without queryWorker.networkPolicy.clusterCidrs the "anywhere" rule
     below also matches pod IPs on CNIs that apply ipBlock to them (Calico,
     …), so the pod rule's exclusions (this release's database, identity
     server) do not hold there: NOTES.txt says so after install. */}}
{{- /*
On by default, unlike the chart-wide `networkPolicy`: queries of every
workspace share these pods. Ingress: only this release's pods that send
queries (api, worker, sql-gateway), plus `extraIngress` (a metrics scraper).
Egress: anywhere a source may be (as for a query Job) and this release's pods
(the result goes back to the API), but not the link-local range, where cloud
metadata endpoints hand out the node's credentials.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "classifyre.queryWorker.fullname" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-worker
spec:
  podSelector:
    matchLabels:
      {{- include "classifyre.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: query-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "classifyre.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, sql-gateway]
      ports:
        - protocol: TCP
          port: {{ $qw.port }}
    {{- with $qw.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Pods in the cluster (in-cluster sources, DNS), matched by pod since some
    # CNIs never match pod IPs with ipBlock; never this release's database,
    # identity server, gateway, workers or the query worker itself. The API
    # stays reachable: a query Job posts its result there.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values: [postgres, iam, sql-gateway, worker, query-worker]
    {{- $v4 := list }}
    {{- $v6 := list }}
    {{- range (concat $qw.networkPolicy.deniedEgressCidrs $qw.networkPolicy.clusterCidrs) }}
    {{- if contains ":" . }}{{ $v6 = append $v6 . }}{{ else }}{{ $v4 = append $v4 . }}{{ end }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $v4 }}
            except: {{ toJson . }}
            {{- end }}
        - ipBlock:
            cidr: ::/0
            {{- with $v6 }}
            except: {{ toJson . }}
            {{- end }}
{{- end }}
{{- end }}
