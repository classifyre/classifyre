{{- if not .Values.api.internalApiKey.existingSecret }}
{{- if include "classifyre.apiInternalKeyEnabled" . }}
{{- $secretName := include "classifyre.apiInternalKeySecretName" . -}}
{{- $secretKey := include "classifyre.apiInternalKeySecretKey" . -}}
{{- /* Reuse the value already in the cluster so a `helm upgrade` never rotates
     the key out from under CLI jobs that are mid-run. */}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingValue := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data $secretKey) -}}
{{- $existingValue = (index $existingSecret.data $secretKey | b64dec) -}}
{{- end -}}
{{- $configuredValue := .Values.api.internalApiKey.value | default "" -}}
{{- $resolvedValue := $existingValue | default $configuredValue -}}
{{- if and (eq $resolvedValue "") .Values.api.internalApiKey.autoGenerate -}}
{{- $resolvedValue = randAlphaNum 48 -}}
{{- end -}}
{{- if eq $resolvedValue "" -}}
{{- fail "api.internalApiKey requires either existingSecret, value, or autoGenerate=true" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $secretKey }}: {{ $resolvedValue | quote }}
{{- end }}
{{- end }}
