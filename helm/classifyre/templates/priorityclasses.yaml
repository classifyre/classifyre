{{- if .Values.priorityClasses.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "classifyre.priorityClassServiceName" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
value: {{ .Values.priorityClasses.serviceValue }}
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "Service workloads priority class"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "classifyre.priorityClassBatchName" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
value: {{ .Values.priorityClasses.batchValue }}
preemptionPolicy: Never
globalDefault: false
description: "Batch CLI Job workloads priority class"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "classifyre.priorityClassInteractiveName" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
value: {{ .Values.priorityClasses.interactiveValue }}
preemptionPolicy: Never
globalDefault: false
description: "Interactive CLI Jobs (SQL queries) priority class"
{{- end }}
