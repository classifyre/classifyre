{{- $secretName := include "classifyre.iam.secretName" . -}}
{{- /* Every value is generated once and then read back from the cluster, so a
     `helm upgrade` never rotates a client secret or a database password out
     from under running pods. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $data := dict -}}
{{- range $key := list "admin-password" "password" "web-client-secret" "api-client-secret" "bootstrap-admin-password" "tenant-database-key" -}}
{{- $value := "" -}}
{{- if and $existing (hasKey $existing.data $key) -}}
{{- $value = index $existing.data $key | b64dec -}}
{{- else -}}
{{- $value = randAlphaNum 40 -}}
{{- end -}}
{{- $_ := set $data $key $value -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # The identity server's database outlives an uninstall, and it keeps the
    # admin password it was first started with. Keeping the Secret too means a
    # reinstall finds matching passwords instead of new random ones the
    # database has never seen.
    helm.sh/resource-policy: keep
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: iam
type: Opaque
stringData:
  # Administrator of the identity server itself; used by the realm setup job.
  admin-password: {{ index $data "admin-password" | quote }}
  # Database password of the `iam` role (database.mode=shared).
  password: {{ index $data "password" | quote }}
  web-client-secret: {{ index $data "web-client-secret" | quote }}
  api-client-secret: {{ index $data "api-client-secret" | quote }}
  # First tenant admin's temporary password; changed at first sign-in.
  bootstrap-admin-password: {{ index $data "bootstrap-admin-password" | quote }}
  # Each tenant database's login password is derived from it. The API sets
  # the passwords at every start, so a new key rotates them all.
  tenant-database-key: {{ index $data "tenant-database-key" | quote }}
{{- if and (eq .Values.iam.database.mode "shared") (eq .Values.postgres.mode "cnpg") }}
---
# CloudNativePG reads managed role passwords from a basic-auth Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "classifyre.iam.dbSecretName" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: iam
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.iam.database.username | quote }}
  password: {{ index $data "password" | quote }}
{{- end }}
