{{- if eq .Values.postgres.mode "cnpg" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cnpg.clusterName }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.cnpg.instances }}
  imageName: {{ .Values.postgres.cnpg.imageName | quote }}
  enableSuperuserAccess: false
  {{- if or .Values.postgres.cnpg.postgresql.parameters .Values.postgres.cnpg.postgresql.sharedPreloadLibraries }}
  postgresql:
    {{- with .Values.postgres.cnpg.postgresql.parameters }}
    parameters:
      {{- range $key, $value := . }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.postgres.cnpg.postgresql.sharedPreloadLibraries }}
    shared_preload_libraries:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.postgres.cnpg.storage.size }}
    {{- with .Values.postgres.cnpg.storage.storageClassName }}
    storageClass: {{ . | quote }}
    {{- end }}
  {{- if .Values.iam.enabled }}
  managed:
    roles:
      {{- if eq .Values.iam.database.mode "shared" }}
      # The identity server's own role; its database is the Database below.
      - name: {{ .Values.iam.database.username | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "classifyre.iam.dbSecretName" . }}
      {{- end }}
      # With sign-in the API makes the control database and one database and
      # role per tenant (docs/prd/TEN §4.5). Its password stays CloudNativePG's.
      - name: {{ .Values.postgres.cnpg.user | quote }}
        ensure: present
        login: true
        createdb: true
        createrole: true
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.cnpg.database | quote }}
      owner: {{ .Values.postgres.cnpg.user | quote }}
      secret:
        name: {{ include "classifyre.databaseSecretName" . }}
      {{- if .Values.iam.enabled }}
      # Tenant databases are made from template1 and the API cannot create
      # extensions here (no superuser), so they inherit it.
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
      {{- end }}
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        {{- if has "pg_stat_statements" .Values.postgres.cnpg.postgresql.sharedPreloadLibraries }}
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements
        {{- end }}
{{- if and .Values.iam.enabled (eq .Values.iam.database.mode "shared") }}
---
# Needs CloudNativePG 1.25 or later (the Database resource).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ printf "%s-%s" .Values.postgres.cnpg.clusterName .Values.iam.database.name }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: iam
spec:
  name: {{ .Values.iam.database.name | quote }}
  owner: {{ .Values.iam.database.username | quote }}
  cluster:
    name: {{ .Values.postgres.cnpg.clusterName }}
{{- end }}
{{- end }}
