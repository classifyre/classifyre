{{- if eq .Values.postgres.mode "cnpg" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cnpg.clusterName }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.cnpg.instances }}
  imageName: {{ .Values.postgres.cnpg.imageName | quote }}
  enableSuperuserAccess: false
  {{- if or .Values.postgres.cnpg.postgresql.parameters .Values.postgres.cnpg.postgresql.sharedPreloadLibraries }}
  postgresql:
    {{- with .Values.postgres.cnpg.postgresql.parameters }}
    parameters:
      {{- range $key, $value := . }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.postgres.cnpg.postgresql.sharedPreloadLibraries }}
    shared_preload_libraries:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.postgres.cnpg.storage.size }}
    {{- with .Values.postgres.cnpg.storage.storageClassName }}
    storageClass: {{ . | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.cnpg.database | quote }}
      owner: {{ .Values.postgres.cnpg.user | quote }}
      secret:
        name: {{ include "classifyre.databaseSecretName" . }}
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        {{- if has "pg_stat_statements" .Values.postgres.cnpg.postgresql.sharedPreloadLibraries }}
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements
        {{- end }}
{{- end }}
