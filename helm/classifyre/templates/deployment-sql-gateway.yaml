{{- if .Values.sqlGateway.enabled }}
{{- /*
SQL gateway (docs/prd/DQ-data-query.md §5.7): the API image with
SERVICE_ROLE=sql, listening for PostgreSQL clients on sqlGateway.port. It does
its own TLS (the certificate Secret is mounted) and SCRAM sign-in against SQL
connections; data statements run as query jobs, so it needs the API's service
account and job template like the API itself.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "classifyre.sqlGateway.fullname" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: sql-gateway
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.sqlGateway.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "classifyre.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sql-gateway
  template:
    metadata:
      labels:
        {{- include "classifyre.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sql-gateway
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.sqlGateway.tls.enabled }}
        {{- /* A new certificate restarts the gateway, which reads it at start. */}}
        checksum/sql-tls: {{ printf "%s/%s/%v" (include "classifyre.sqlGateway.tlsSecret" .) .Values.sqlGateway.publicHost .Values.sqlGateway.tls.extraSans | sha256sum | trunc 16 }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "classifyre.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with (include "classifyre.priorityClassName" (dict "name" .Values.api.priorityClassName "root" .)) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- if ne .Values.api.terminationGracePeriodSeconds nil }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.migration.enabled }}
      initContainers:
        {{- include "classifyre.migrationInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: sql-gateway
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- if .Values.api.command }}
          command:
            {{- toYaml .Values.api.command | nindent 12 }}
          {{- else }}
          command:
            - /bin/sh
            - -lc
          {{- end }}
          {{- if .Values.api.args }}
          args:
            {{- toYaml .Values.api.args | nindent 12 }}
          {{- else if not .Values.api.command }}
          args:
            - >-
              set -eu;
              {{- if .Values.api.workingDir }}
              cd {{ .Values.api.workingDir | quote }};
              {{- end }}
              if [ -d "/app/node_modules" ] && [ ! -e "/node_modules" ]; then
                ln -s /app/node_modules /node_modules;
              fi;
              if [ -z "${DATABASE_URL:-}" ] || [ "${DATABASE_URL}" = "postgresql://postgres@127.0.0.1:5432/classifyre" ]; then
                export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}";
              fi;
              exec {{ .Values.api.startCommand }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
            - name: postgres
              containerPort: {{ .Values.sqlGateway.port }}
              protocol: TCP
          env:
            {{- include "classifyre.api.env" (dict "root" . "role" "sql") | nindent 12 }}
            - name: SERVICE_ROLE
              value: "sql"
            - name: SQL_GATEWAY_ENABLED
              value: "true"
            - name: SQL_GATEWAY_PORT
              value: {{ .Values.sqlGateway.port | quote }}
            {{- if .Values.sqlGateway.tls.enabled }}
            - name: SQL_GATEWAY_TLS_CERT_FILE
              value: /etc/classifyre/sql-tls/tls.crt
            - name: SQL_GATEWAY_TLS_KEY_FILE
              value: /etc/classifyre/sql-tls/tls.key
            - name: SQL_GATEWAY_ALLOW_PLAINTEXT
              value: {{ .Values.sqlGateway.tls.allowPlaintext | quote }}
            {{- end }}
            - name: SQL_GATEWAY_PROXY_PROTOCOL
              value: {{ .Values.sqlGateway.proxyProtocol | quote }}
            - name: SQL_GATEWAY_TRUSTED_PROXIES
              value: {{ join "," .Values.sqlGateway.trustedProxies | quote }}
            - name: SQL_GATEWAY_ALLOWED_CIDRS
              value: {{ join "," .Values.sqlGateway.allowedCidrs | quote }}
            - name: SQL_GATEWAY_MAX_SESSIONS
              value: {{ .Values.sqlGateway.maxSessions | quote }}
            - name: SQL_GATEWAY_MAX_SESSIONS_PER_CONNECTION
              value: {{ .Values.sqlGateway.maxSessionsPerConnection | quote }}
            - name: SQL_GATEWAY_IDLE_MINUTES
              value: {{ .Values.sqlGateway.idleMinutes | quote }}
            - name: SQL_GATEWAY_SESSION_MEMORY_MB
              value: {{ .Values.sqlGateway.sessionMemoryMb | quote }}
            - name: SQL_GATEWAY_CATALOG_PG_SOCKET
              value: /var/run/sql-catalog-pg
            - name: SQL_GATEWAY_CATALOG_PG_USER
              value: classifyre_catalog
            - name: SQL_GATEWAY_CATALOG_WORK_MEM
              value: {{ .Values.sqlGateway.catalog.workMem | quote }}
            - name: SQL_GATEWAY_CATALOG_STATEMENT_SECONDS
              value: {{ .Values.sqlGateway.catalog.statementTimeoutSeconds | quote }}
            - name: SQL_GATEWAY_CATALOG_DB_TTL_MINUTES
              value: {{ .Values.sqlGateway.catalog.dbTtlMinutes | quote }}
            - name: SQL_GATEWAY_MAX_CATALOG_DBS
              value: {{ .Values.sqlGateway.catalog.maxCatalogDbs | quote }}
          {{- with .Values.api.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.sqlGateway.tls.enabled }}
            - name: sql-tls
              mountPath: /etc/classifyre/sql-tls
              readOnly: true
            {{- end }}
            - name: sql-catalog-socket
              mountPath: /var/run/sql-catalog-pg
            {{- if .Values.api.cliJobs.enabled }}
            - name: cli-job-template
              mountPath: /etc/classifyre/cli-job-template
              readOnly: true
            {{- include "classifyre.queryWorker.tokenMount" . | trim | nindent 12 }}
            {{- end }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.sqlGateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health/sql-gateway
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: catalog-postgres
          image: {{ .Values.sqlGateway.catalog.image.repository }}:{{ .Values.sqlGateway.catalog.image.tag }}
          imagePullPolicy: {{ .Values.sqlGateway.catalog.image.pullPolicy }}
          args:
            - -c
            - listen_addresses=
            - -c
            - unix_socket_directories=/var/run/sql-catalog-pg
            - -c
            - unix_socket_permissions=0777
            - -c
            - fsync=off
            - -c
            - synchronous_commit=off
            - -c
            - full_page_writes=off
            - -c
            - wal_level=minimal
            - -c
            - max_wal_senders=0
            - -c
            - {{ printf "shared_buffers=%s" .Values.sqlGateway.catalog.sharedBuffers | quote }}
            - -c
            - {{ printf "work_mem=%s" .Values.sqlGateway.catalog.workMem | quote }}
            - -c
            - temp_file_limit=0
            - -c
            - {{ printf "max_connections=%d" (add (int .Values.sqlGateway.maxSessions) 16) | quote }}
            - -c
            - autovacuum_max_workers=1
            - -c
            - autovacuum_naptime=5min
            - -c
            - jit=off
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: classifyre_catalog
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_INITDB_ARGS
              value: "--no-sync"
          volumeMounts:
            - name: sql-catalog-data
              mountPath: /var/lib/postgresql/data
            - name: sql-catalog-socket
              mountPath: /var/run/sql-catalog-pg
            - name: sql-catalog-run
              mountPath: /var/run/postgresql
            - name: sql-catalog-tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - /var/run/sql-catalog-pg
                - -U
                - classifyre_catalog
                - -d
                - postgres
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.sqlGateway.catalog.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sqlGateway.catalog.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.sqlGateway.tls.enabled }}
        - name: sql-tls
          secret:
            secretName: {{ include "classifyre.sqlGateway.tlsSecret" . }}
            optional: true
        {{- end }}
        - name: sql-catalog-data
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sqlGateway.catalog.tmpfsSizeLimit }}
        - name: sql-catalog-socket
          emptyDir: {}
        - name: sql-catalog-run
          emptyDir: {}
        - name: sql-catalog-tmp
          emptyDir: {}
        {{- if .Values.api.cliJobs.enabled }}
        - name: cli-job-template
          configMap:
            name: {{ include "classifyre.api.fullname" . }}-cli-job-template
        {{- include "classifyre.queryWorker.tokenVolume" . | trim | nindent 8 }}
        {{- end }}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
