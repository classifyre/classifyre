{{- if .Values.sqlGateway.enabled }}
{{- /*
SQL gateway (docs/prd/DQ-data-query.md §5.7): the API image with
SERVICE_ROLE=sql, listening for PostgreSQL clients on sqlGateway.port. It does
its own TLS (the certificate Secret is mounted) and SCRAM sign-in against SQL
connections; data statements run as query jobs, so it needs the API's service
account and job template like the API itself.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "classifyre.sqlGateway.fullname" . }}
  labels:
    {{- include "classifyre.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: sql-gateway
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.sqlGateway.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "classifyre.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sql-gateway
  template:
    metadata:
      labels:
        {{- include "classifyre.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sql-gateway
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* A new certificate restarts the gateway, which reads it at start. */}}
        checksum/sql-tls: {{ printf "%s/%s/%v" (include "classifyre.sqlGateway.tlsSecret" .) .Values.sqlGateway.publicHost .Values.sqlGateway.tls.extraSans | sha256sum | trunc 16 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "classifyre.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with (include "classifyre.priorityClassName" (dict "name" .Values.api.priorityClassName "root" .)) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- if ne .Values.api.terminationGracePeriodSeconds nil }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.migration.enabled }}
      initContainers:
        {{- include "classifyre.migrationInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: sql-gateway
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- if .Values.api.command }}
          command:
            {{- toYaml .Values.api.command | nindent 12 }}
          {{- else }}
          command:
            - /bin/sh
            - -lc
          {{- end }}
          {{- if .Values.api.args }}
          args:
            {{- toYaml .Values.api.args | nindent 12 }}
          {{- else if not .Values.api.command }}
          args:
            - >-
              set -eu;
              {{- if .Values.api.workingDir }}
              cd {{ .Values.api.workingDir | quote }};
              {{- end }}
              if [ -d "/app/node_modules" ] && [ ! -e "/node_modules" ]; then
                ln -s /app/node_modules /node_modules;
              fi;
              if [ -z "${DATABASE_URL:-}" ] || [ "${DATABASE_URL}" = "postgresql://postgres@127.0.0.1:5432/classifyre" ]; then
                export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}";
              fi;
              exec {{ .Values.api.startCommand }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
            - name: postgres
              containerPort: {{ .Values.sqlGateway.port }}
              protocol: TCP
          env:
            {{- include "classifyre.api.env" (dict "root" . "role" "sql") | nindent 12 }}
            - name: SERVICE_ROLE
              value: "sql"
            - name: SQL_GATEWAY_ENABLED
              value: "true"
            - name: SQL_GATEWAY_PORT
              value: {{ .Values.sqlGateway.port | quote }}
            {{- if include "classifyre.sqlGateway.terminatesTls" . }}
            - name: SQL_GATEWAY_TLS_CERT_FILE
              value: /etc/classifyre/sql-tls/tls.crt
            - name: SQL_GATEWAY_TLS_KEY_FILE
              value: /etc/classifyre/sql-tls/tls.key
            {{- end }}
            {{- $terminate := and .Values.sqlGateway.traefik.enabled (eq .Values.sqlGateway.traefik.tls "terminate") }}
            - name: SQL_GATEWAY_ALLOW_PLAINTEXT
              value: {{ or .Values.sqlGateway.tls.allowPlaintext $terminate | quote }}
            - name: SQL_GATEWAY_PROXY_PROTOCOL
              value: {{ or .Values.sqlGateway.proxyProtocol $terminate | quote }}
            - name: SQL_GATEWAY_ALLOWED_CIDRS
              value: {{ join "," .Values.sqlGateway.allowedCidrs | quote }}
            - name: SQL_GATEWAY_MAX_SESSIONS
              value: {{ .Values.sqlGateway.maxSessions | quote }}
            - name: SQL_GATEWAY_MAX_SESSIONS_PER_CONNECTION
              value: {{ .Values.sqlGateway.maxSessionsPerConnection | quote }}
            - name: SQL_GATEWAY_IDLE_MINUTES
              value: {{ .Values.sqlGateway.idleMinutes | quote }}
          {{- with .Values.api.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: sql-tls
              mountPath: /etc/classifyre/sql-tls
              readOnly: true
            {{- if .Values.api.cliJobs.enabled }}
            - name: cli-job-template
              mountPath: /etc/classifyre/cli-job-template
              readOnly: true
            {{- end }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.sqlGateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
            failureThreshold: 3
          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: sql-tls
          secret:
            secretName: {{ include "classifyre.sqlGateway.tlsSecret" . }}
            optional: true
        {{- if .Values.api.cliJobs.enabled }}
        - name: cli-job-template
          configMap:
            name: {{ include "classifyre.api.fullname" . }}-cli-job-template
        {{- end }}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
