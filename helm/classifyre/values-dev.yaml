# Local k3d overrides. Production defaults and templates remain unchanged.
api:
  replicaCount: 1
  autoscaling:
    enabled: false
  pdb:
    enabled: false

  image:
    repository: oven/bun
    tag: latest
    pullPolicy: Always

  # Fixed rather than autoGenerate: the chart's default `randAlphaNum` value is
  # only stable across a `helm upgrade` (guarded by a Secret `lookup`) -- it is
  # NOT stable across a full `helm uninstall`/reinstall (e.g. `skaffold dev`
  # exiting with its default cleanup, or a `k3d cluster delete`), which deletes
  # the Secret object outright. If the Postgres PVC survives that but the key
  # doesn't, every previously issued MCP token (and any other masked-config
  # ciphertext) becomes permanently unverifiable/undecryptable even though the
  # rows are still there. A fixed local-only dev value survives any of that.
  maskedConfigEncryption:
    value: "classifyre-dev-fixed-key-0000001"

  embedding:
    enabled: false

  command: ["/bin/sh", "-lc"]
  args:
    - |
      set -eu
      cd /workspace
      dependency_hash="$(sha256sum bun.lock package.json apps/api/package.json packages/schemas/package.json apps/api/prisma/schema.prisma | sha256sum | cut -d ' ' -f 1)"
      marker="/var/cache/classifyre/bun/dependencies-${dependency_hash}"
      if [ ! -f "${marker}" ]; then
        while ! mkdir /var/cache/classifyre/bun/install.lock 2>/dev/null; do sleep 0.2; done
        trap 'rmdir /var/cache/classifyre/bun/install.lock 2>/dev/null || true' EXIT
        if [ ! -f "${marker}" ]; then
          bun install --frozen-lockfile --filter @classifyre/api
          cd /workspace/apps/api
          bun run prisma:generate
          touch "${marker}"
          cd /workspace
        fi
        rmdir /var/cache/classifyre/bun/install.lock
        trap - EXIT
      else
        while [ -d /var/cache/classifyre/bun/install.lock ]; do sleep 0.2; done
      fi
      cd /workspace/apps/api
      export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}"
      until bun -e 'const net = require("net"); const socket = net.connect(Number(process.env.DB_PORT), process.env.DB_HOST, () => { socket.end(); process.exit(0); }); socket.on("error", () => process.exit(1)); setTimeout(() => process.exit(1), 1000);'; do
        echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT}"
        sleep 1
      done
      exec bun --watch src/main.ts

  env:
    NODE_ENV: development
    PORT: "8000"
    ENVIRONMENT: kubernetes
    HOME: /tmp
    BUN_INSTALL_CACHE_DIR: /var/cache/classifyre/bun/install
    TEMP_DIR: /tmp
    RUNNER_LOGS_DIR: /tmp/classifyre/runner-logs
    MAX_RUNNERS_PER_SOURCE: "5"
    # Two different caps, and only the second one gates adaptive scheduling:
    #   MAX_CONCURRENT_RUNNERS      - hard instance-wide cap in CliRunnerService;
    #                                 QUEUES what is over it.
    #   AUTO_SCHEDULE_MAX_CONCURRENT - what the AUTO scheduler will let be in
    #                                 flight before it declines to start more.
    #                                 Defaults to 2, and nothing sets it.
    # Raising only the first left the scheduler still logging "cap 2" and
    # holding overdue sources back with slots free, so both move together.
    #
    # Back to two from four. Four was chosen when the register sweep looked
    # ingest-bound on an idle node, but this is a single 16Gi k3d node that
    # also hosts Postgres, the API and the worker — and each extract pod is
    # allowed 2 CPU and 8Gi. Four concurrent scans plus the worker's embedding
    # runtimes is what turns node pressure into OOM kills. Two leaves the node
    # room to absorb a scan that hits a heavy PDF without taking Postgres's
    # page cache with it.
    #
    # Note this cap is enforced per NAMESPACE, not deployment-wide as
    # CliRunnerService's comment claims: canStartNewRunner() counts through the
    # namespace-scoped Prisma client, so the real ceiling is this number times
    # the number of active workspaces. With four namespaces, "2" is up to 8.
    # One, because the resource budget below only has room for one extract pod
    # (7Gi requested against ~15.9Gi allocatable, with postgres/api/worker
    # reserved). Keeping the application cap and the scheduler's arithmetic in
    # agreement means the second scan waits in the app queue rather than
    # creating a Job that sits Pending and holds a uv-cache mount.
    #
    # The per-namespace caveat below still applies -- with N workspaces this is
    # still N -- but it no longer decides whether the node survives: the memory
    # *request* on the CLI Job does, and the scheduler enforces that one.
    MAX_CONCURRENT_RUNNERS: "1"
    AUTO_SCHEDULE_MAX_CONCURRENT: "1"
    # Politeness on a shared node, NOT a memory fix. This was halved from 4 as
    # an OOM mitigation on the theory that each namespace forks its own
    # onnxruntime and four of them were stacking up. That theory was wrong on
    # both counts: EmbeddingProviderService is a singleton owning exactly ONE
    # forked child for the whole process, and only one namespace here has
    # embeddings enabled at all (firmenbuch-test-2, via a DB override — this
    # values file sets api.embedding.enabled=false, which a workspace row
    # overrides). The pod was dying on a single 2,000-row inference call; see
    # worker.resources below. Thread count is a CPU knob — keep it modest so
    # background embedding does not starve the API, and do not expect it to
    # bound memory.
    EMBEDDING_INTRA_OP_THREADS: "2"
    DEMO_MODE: "false"

  extraVolumeMounts:
    - name: development-source
      mountPath: /workspace/package.json
      subPath: package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/bun.lock
      subPath: bun.lock
      readOnly: true
    - name: development-source
      mountPath: /workspace/turbo.json
      subPath: turbo.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/patches
      subPath: patches
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/api/package.json
      subPath: apps/api/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/blog/package.json
      subPath: apps/blog/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/cli/package.json
      subPath: apps/cli/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/desktop/package.json
      subPath: apps/desktop/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/docs/package.json
      subPath: apps/docs/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/e2e/package.json
      subPath: apps/e2e/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/web/package.json
      subPath: apps/web/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/api-client/package.json
      subPath: packages/api-client/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/devops/package.json
      subPath: packages/devops/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/eslint-config/package.json
      subPath: packages/eslint-config/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/schemas/package.json
      subPath: packages/schemas/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/typescript-config/package.json
      subPath: packages/typescript-config/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/ui/package.json
      subPath: packages/ui/package.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/api/src
      subPath: apps/api/src
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/api/prisma
      subPath: apps/api/prisma
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/api/prisma.config.ts
      subPath: apps/api/prisma.config.ts
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/api/nest-cli.json
      subPath: apps/api/nest-cli.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/api/tsconfig.json
      subPath: apps/api/tsconfig.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/apps/api/tsconfig.build.json
      subPath: apps/api/tsconfig.build.json
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/schemas/src
      subPath: packages/schemas/src
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/eslint-config/base.js
      subPath: packages/eslint-config/base.js
      readOnly: true
    - name: development-source
      mountPath: /workspace/packages/typescript-config/base.json
      subPath: packages/typescript-config/base.json
      readOnly: true
    - name: api-root-node-modules
      mountPath: /workspace/node_modules
    - name: api-node-modules
      mountPath: /workspace/apps/api/node_modules
    - name: api-schemas-node-modules
      mountPath: /workspace/packages/schemas/node_modules
    - name: api-eslint-node-modules
      mountPath: /workspace/packages/eslint-config/node_modules
    - name: api-typescript-config-node-modules
      mountPath: /workspace/packages/typescript-config/node_modules
    - name: api-bun-cache
      mountPath: /var/cache/classifyre/bun
  extraVolumes:
    - name: development-source
      hostPath:
        path: /var/lib/classifyre/source
        type: Directory
    - name: api-root-node-modules
      hostPath:
        path: /var/lib/classifyre/cache/api/root-node-modules
        type: Directory
    - name: api-node-modules
      hostPath:
        path: /var/lib/classifyre/cache/api/api-node-modules
        type: Directory
    - name: api-schemas-node-modules
      hostPath:
        path: /var/lib/classifyre/cache/api/schemas-node-modules
        type: Directory
    - name: api-eslint-node-modules
      hostPath:
        path: /var/lib/classifyre/cache/api/eslint-node-modules
        type: Directory
    - name: api-typescript-config-node-modules
      hostPath:
        path: /var/lib/classifyre/cache/api/typescript-config-node-modules
        type: Directory
    - name: api-bun-cache
      hostPath:
        path: /var/lib/classifyre/cache/api/bun
        type: Directory

  # Every limit in this file is sized against ONE 16Gi / 10-CPU k3d node, and
  # they are meant to be read together. Before this pass the limits summed to
  # 31.9Gi -- 199% of the node -- because the scheduler only ever looks at
  # requests, and every pod requested a token 100m/256Mi. So everything fit on
  # paper and then fought over memory that did not exist. The budget now is:
  #
  #   postgres   3Gi  (request == limit, Guaranteed)
  #   api        2Gi
  #   worker     3Gi
  #   extract    7Gi  (request == limit, so exactly one fits)
  #   ---------------
  #   total     15Gi  against ~15.9Gi allocatable
  #
  # Change one and re-check the sum, or the node goes back to overcommitted.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  affinity: {}
  topologySpreadConstraints: []
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 5
  startupProbe:
    enabled: true
    periodSeconds: 2
    failureThreshold: 90

  # With the init-container disabled, the API's existing Kubernetes startup
  # path applies pending migrations using the same source-mounted runtime.
  migration:
    enabled: false

  # Folders a "Mounted Folder" source (or a notebook's ctx.folder) can read.
  # Both paths live inside the k3d node: `dump_files` comes from this checkout,
  # which create-cluster.sh mounts at /var/lib/classifyre/source, and
  # `downloads` is the host's ~/Downloads, mounted by create-cluster.sh so there
  # is real, changing data to point a scan at. A cluster created before that
  # mount existed has no ~/Downloads inside the node, so the entry uses
  # DirectoryOrCreate and simply comes up empty there instead of wedging every
  # CLI job on a failed mount.
  localFolders:
    - name: dumps
      mountPath: /mnt/corpora/dumps
      hostPath:
        path: /var/lib/classifyre/source/dump_files
        type: Directory
    - name: downloads
      mountPath: /mnt/corpora/downloads
      hostPath:
        path: /var/lib/classifyre/host-folders/downloads
        type: DirectoryOrCreate

  cliJobs:
    enabled: true
    image:
      repository: classifyre/cli
      tag: latest
      pullPolicy: Always
    workDir: /app/apps/cli
    cleanupPolicy: failed
    backoffLimit: 0
    extraVolumeMounts:
      - name: cli-development-source
        mountPath: /app/apps/cli/src
        readOnly: true
      - name: schemas-development-source
        mountPath: /app/packages/schemas/src
        readOnly: true
    extraVolumes:
      - name: cli-development-source
        hostPath:
          path: /var/lib/classifyre/source/apps/cli/src
          type: Directory
      - name: schemas-development-source
        hostPath:
          path: /var/lib/classifyre/source/packages/schemas/src
          type: Directory
    resources:
      requests:
        cpu: 500m
        # Equal to the limit, which reverses the previous advice here. Keeping
        # the request small did let several scans schedule side by side -- that
        # was the bug, not the feature. The node cannot actually honour two 10Gi
        # jobs, so "they all fit" only meant the collision happened later, in
        # the kernel, where the victim is chosen by oom_score rather than by
        # anything that knows Postgres matters more than a PDF.
        #
        # Requesting the full 7Gi makes the *scheduler* the enforcement point:
        # with postgres+api+worker reserved, there is room for exactly one
        # extract pod, and a second stays Pending until the first finishes.
        # Slow, which is fine. It also means this holds regardless of
        # MAX_CONCURRENT_RUNNERS, which is counted per namespace and therefore
        # multiplies by the number of workspaces.
        memory: 7Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: "2"
        # 4Gi was not enough for a real scanned PDF: a filing with no text layer
        # falls through to docling's StandardPdfPipeline (layout transformer +
        # TableFormer, on CPU), which OOMKilled the job (exit 137) mid-scan.
        # 7Gi rather than the 10Gi that replaced it, because 10Gi was only ever
        # affordable while the node was overcommitted -- two such jobs claimed
        # 20Gi of a 16Gi machine. A job that still exceeds 7Gi now dies alone,
        # which is the intended blast radius: one lost run, not a lost database.
        memory: 7Gi
        ephemeral-storage: 10Gi
    uvCache:
      enabled: true
      accessModes: [ReadWriteOnce]
      size: 5Gi
      prune:
        enabled: false

worker:
  replicaCount: 1
  resources:
    requests:
      # A real request, not a token one. 100m gave the worker the same cgroup v2
      # CPU weight as Postgres and as every extract pod, so "the node is busy"
      # and "Postgres is starved" were the same event.
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      # 6Gi, and this is not the lever. The pod was OOMKilled (exit 137) at
      # 4Gi, 6Gi AND 8Gi. Sampled from the cgroup at 8Gi:
      #
      #   12:59:19   729 MB   <- flat baseline for minutes
      #   12:59:48  5041 MB
      #   13:00:43  8190 MB   <- hit the 8192 cap exactly, still climbing
      #
      # 729 MB to the ceiling in 85 seconds, whatever the ceiling is. Root
      # cause, found 2026-09-07 and fixed in EmbeddingProviderService: the
      # queue handler flattened one pg-boss fetch — EMBEDDING_BATCH_SIZE=32
      # jobs x EMBEDDING_QUEUE_BATCH_SIZE=64 chunks — into a single
      # ~2,000-row inference call. transformers.js tokenizes with
      # `padding: true`, so a batch pads to its longest row and one attention
      # tensor costs rows x heads x seq x seq x 4: at 2,000 rows of ~300
      # tokens on MiniLM-L6 that is 8.6 GB, for one tensor. pg-boss agreed —
      # all eight of those batches were still `active` when their containers
      # died, one per container lifetime; none ever completed.
      #
      # It was never about namespace count: one namespace has embeddings on,
      # and there is one forked onnxruntime for the whole process. Inference
      # is now bounded by rows AND by rows x longest-text
      # (EMBEDDING_MAX_BATCH_CHARS, default 64,000) and serialised across
      # callers, which puts the peak in the low hundreds of MB.
      #
      # 6Gi rather than 8Gi because the ceiling was never what saved the pod:
      # a higher one only lets a runaway take more of the single 16Gi node
      # before it dies, competing with Postgres for the page cache it already
      # lacks.
      #
      # worker.maxOldSpaceSizeMb is not the lever either: the JS heap sat at
      # 391 Mi while the pod died. The allocation is native and V8 flags
      # cannot bound it; raising the cap only lets V8 compete for the same
      # budget.
      #
      # 3Gi now, down from 6Gi, for the reason the last paragraph already gave:
      # the ceiling never saved the pod, it only decided how much of the node a
      # runaway took on its way out. With the inference batch bounded the peak
      # is in the low hundreds of MB, so 3Gi is ~10x real usage and it keeps the
      # node's total limits under what the node actually has. If the worker
      # OOMKills at 3Gi, that is a batching regression to go and find -- raising
      # this number back up would only hide it and re-overcommit the node.
      memory: 3Gi

frontend:
  # Web is not deployed in-cluster for local dev — run it directly on your
  # machine (cd apps/web && bun install && bun run dev) pointed at this
  # cluster's API (http://127.0.0.1:8811 via the skaffold port-forward, or
  # http://classifyre.localhost:8080/api via ingress). See scripts/dev/README.md.
  enabled: false

ingress:
  enabled: true
  className: nginx
  host: classifyre.localhost

postgres:
  mode: embedded
  embedded:
    database: classifyre
    username: postgres
    password: postgres
    persistence:
      # Keep local dev data across pod restarts and Skaffold sessions.
      enabled: true
      # scripts/dev/stop.sh runs `skaffold delete`, which uninstalls the Helm
      # release. Without this, the PVC (and the local-path storage class's
      # underlying volume data) gets deleted along with it. This keeps the
      # PVC around so `start.sh` reattaches to the same data next time.
      keepOnUninstall: true
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    parameters:
      # Raised with the memory limit below. At 128MB against a 1Gi limit every
      # query was effectively disk-bound -- cold planning alone was measured in
      # seconds -- which is also what made pg_isready time out under load and
      # get the database killed. Cache starvation was a stability problem here,
      # not just a speed one.
      shared_buffers: 768MB
      work_mem: 16MB
    resources:
      # Request == limit puts Postgres in the Guaranteed QoS class, and that is
      # the point of this whole block. Requests are what the kernel and kubelet
      # actually rank by: the CPU request is the cgroup v2 scheduling weight,
      # and the memory request sets oom_score_adj and the node-pressure eviction
      # order. At 100m/256Mi Postgres had the same CPU weight as a docling
      # pipeline and, running 3x over its request, was a leading OOM candidate.
      # Guaranteed makes it the last thing on the node to be touched.
      requests:
        cpu: "2"
        memory: 3Gi
      limits:
        cpu: "2"
        memory: 3Gi

networkPolicy:
  enabled: false
priorityClasses:
  create: true
telemetry:
  enabled: false
  instanceId:
    enabled: false
objectStorage:
  enabled: false
