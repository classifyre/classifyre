apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: classifyre

servers: 1
agents: 0

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: "15m"
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --kubelet-arg=image-pull-progress-deadline=15m
        nodeFilters:
          - server:*
      - arg: --kubelet-arg=runtime-request-timeout=15m
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
