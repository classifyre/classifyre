# EmbeddingGemma 2 on CPU for the local k3d cluster, served by llama.cpp's own
# server. An OpenAI-compatible embeddings endpoint the API and worker can be
# pointed at as an AI provider:
#
#   base URL  http://llama-embedding.classifyre-dev.svc:8080/v1
#   model     embeddinggemma-2
#
# It takes pictures and sound as well as text: on the provider, set "How media
# is sent" to "llama.cpp server" and tick what the workspace should embed.
#
# Why llama.cpp and not Ollama (deploy/dev/ollama.yaml): on 2026-10-11 Ollama
# 0.40.3 runs this model on Apple Silicon only. Its library tags are MLX builds
# ("this model requires MLX support, but the MLX runtime is not available",
# ollama/ollama#18825) and its bundled llama.cpp does not know the GGUF's
# `gemma-embedding2` architecture yet. llama.cpp itself does.
#
# Not part of the Helm chart and not deployed by `skaffold dev`:
#
#   kubectl --context k3d-classifyre apply -f deploy/dev/llama-embedding.yaml
#
# The first start downloads the weights into the volume: about 310 MB for the
# text model and 555 MB for the projector that holds the vision and audio
# encoders. The node has no GPU, so this is CPU inference; `--threads` and the
# CPU limit are the numbers to change when measuring.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-embedding-models
  namespace: classifyre-dev
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-embedding
  namespace: classifyre-dev
  labels:
    app.kubernetes.io/name: llama-embedding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-embedding
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-embedding
    spec:
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --hf-repo
            - ggml-org/embeddinggemma-2-GGUF:Q8_0
            # The repo's mmproj file (the vision and audio encoders) is loaded
            # with it, which is what lets `/v1/embeddings` take a picture or a
            # clip. It brings the pod from about 1 GB to about 2 GB resident;
            # add `--no-mmproj` here to serve text only.
            - --alias
            - embeddinggemma-2
            - --embedding
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # Four slots of 2,048 tokens: a chunk is at most 1,200 characters,
            # so this leaves room for long queries without paying for the
            # model's full window on every slot.
            - --ctx-size
            - "8192"
            - --parallel
            - "4"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --threads
            - "4"
          env:
            - name: LLAMA_CACHE
              value: /models
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-embedding-models
---
apiVersion: v1
kind: Service
metadata:
  name: llama-embedding
  namespace: classifyre-dev
  labels:
    app.kubernetes.io/name: llama-embedding
spec:
  selector:
    app.kubernetes.io/name: llama-embedding
  ports:
    - name: http
      port: 8080
      targetPort: http
