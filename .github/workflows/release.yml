name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version to release, counted up from main (patch 0.7.4 -> 0.7.5, minor -> 0.8.0, major -> 1.0.0)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release From Develop
    runs-on: ubuntu-latest

    # What the two jobs after this one need. `released_tag` is set only once
    # the tag is on origin.
    outputs:
      version: ${{ steps.versions.outputs.version }}
      next_version: ${{ steps.versions.outputs.next_version }}
      released_tag: ${{ steps.push.outputs.tag }}

    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN || '' }}
      REPO: ${{ github.repository }}

    steps:
      # ── 1. Validate branch ─────────────────────────────────────────────
      - name: Require develop branch
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "develop" ]]; then
            echo "::error::Release must be triggered from the develop branch"
            exit 1
          fi

      # ── 2. Checkout with FULL history of ALL branches ──────────────────
      - name: Checkout develop (full history)
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all remote branches
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── 3. Validate versions ───────────────────────────────────────────
      - name: Validate develop is SNAPSHOT and main version is lower
        id: versions
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          # ── Read develop version ──
          develop_version="$(node -p "require('./package.json').version")"
          echo "Develop version: ${develop_version}"

          if [[ "${develop_version}" != *-SNAPSHOT ]]; then
            echo "::error::develop must have a SNAPSHOT version (got: ${develop_version})"
            exit 1
          fi

          # Strip -SNAPSHOT to get the base version develop is targeting
          develop_base="${develop_version%%-*}"
          if ! [[ "${develop_base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::develop version (${develop_version}) must be <major.minor.patch>-SNAPSHOT"
            exit 1
          fi

          # ── Read main version ──
          main_version="$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")"
          main_base="${main_version%%-*}"
          echo "Main version: ${main_version} (base: ${main_base})"

          if [[ "${main_version}" == *-SNAPSHOT ]]; then
            echo "::error::main must not have a SNAPSHOT version (got: ${main_version})"
            exit 1
          fi

          # ── Verify develop contains the last release ──
          last_tag="v${main_base}"
          if git rev-parse --quiet --verify "refs/tags/${last_tag}" >/dev/null &&
             ! git merge-base --is-ancestor "${last_tag}" HEAD; then
            after="$(node -p "const [a,b,c] = '${main_base}'.split('.').map(Number); [a,b,c+1].join('.')")"
            echo "::error::develop does not contain ${last_tag}: that release stopped before updating develop. Run: scripts/advance-develop.sh ${last_tag} ${after}"
            exit 1
          fi

          # ── Verify main < develop base ──
          is_lower="$(
            MAIN="${main_base}" DEV="${develop_base}" node -e "
              const cmp = (a, b) => {
                const [a1,a2,a3] = a.split('.').map(Number);
                const [b1,b2,b3] = b.split('.').map(Number);
                return (a1 - b1) || (a2 - b2) || (a3 - b3);
              };
              process.stdout.write(cmp(process.env.MAIN, process.env.DEV) < 0 ? 'yes' : 'no');
            "
          )"
          if [[ "${is_lower}" != "yes" ]]; then
            echo "::error::main version (${main_base}) must be lower than develop SNAPSHOT base (${develop_base})"
            exit 1
          fi

          # ── Compute release version ──
          # release_type is the size of THIS release, counted up from main's
          # version (main 0.7.4: patch -> 0.7.5, minor -> 0.8.0, major -> 1.0.0).
          # It used to size the NEXT snapshot while this release always took
          # develop's SNAPSHOT base, so "minor" shipped a patch and left the
          # minor for the release after it.
          # develop's SNAPSHOT base is a floor: a release can't go below the
          # version develop already targets.
          if ! [[ "${RELEASE_TYPE}" =~ ^(patch|minor|major)$ ]]; then
            echo "::error::release_type must be one of: patch, minor, major"
            exit 1
          fi

          version="$(
            CURRENT="${main_base}" node -e "
              const type = process.env.RELEASE_TYPE;
              const [major, minor, patch] = process.env.CURRENT.split('.').map(Number);
              const next =
                type === 'major' ? [major + 1, 0, 0] :
                type === 'minor' ? [major, minor + 1, 0] :
                [major, minor, patch + 1];
              process.stdout.write(next.join('.'));
            "
          )"
          tag="v${version}"

          below_develop="$(
            VERSION="${version}" DEV="${develop_base}" node -e "
              const cmp = (a, b) => {
                const [a1,a2,a3] = a.split('.').map(Number);
                const [b1,b2,b3] = b.split('.').map(Number);
                return (a1 - b1) || (a2 - b2) || (a3 - b3);
              };
              process.stdout.write(cmp(process.env.VERSION, process.env.DEV) < 0 ? 'yes' : 'no');
            "
          )"
          if [[ "${below_develop}" == "yes" ]]; then
            echo "::error::${RELEASE_TYPE} from main ${main_base} gives ${version}, below the ${develop_base} develop already targets. Pick a larger release_type."
            exit 1
          fi

          # The next SNAPSHOT is always the patch after this release
          next_version="$(
            CURRENT="${version}" node -e "
              const [major, minor, patch] = process.env.CURRENT.split('.').map(Number);
              process.stdout.write([major, minor, patch + 1].join('.'));
            "
          )"

          # ── Verify tag doesn't exist ──
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "${tag}" | grep -q "${tag}$"; then
            echo "::error::Tag ${tag} already exists on origin"
            exit 1
          fi

          echo "version=${version}"            >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}"                    >> "${GITHUB_OUTPUT}"
          echo "next_version=${next_version}"  >> "${GITHUB_OUTPUT}"
          echo ""
          echo "Release plan:"
          echo "  Current main:     ${main_version}"
          echo "  Current develop:  ${develop_version}"
          echo "  Release version:  ${version} (tag: ${tag})"
          echo "  Next SNAPSHOT:    ${next_version}-SNAPSHOT"

      # ── 4. Verify CI passed on develop ─────────────────────────────────
      - name: Verify develop CI already succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_sha="$(git rev-parse HEAD)"
          run_json="$(
            gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${expected_sha}&per_page=50" \
              --jq '.workflow_runs | map(select(.status == "completed" and .head_branch == "develop")) | sort_by(.created_at) | reverse | .[0]'
          )"

          if [[ -z "${run_json}" || "${run_json}" == "null" ]]; then
            echo "::error::No completed CI run for develop@${expected_sha}. Wait for it, or start one: gh workflow run ci.yml --ref develop"
            exit 1
          fi

          conclusion="$(jq -r '.conclusion // empty' <<< "${run_json}")"
          html_url="$(jq -r '.html_url // empty' <<< "${run_json}")"

          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::Latest CI for develop@${expected_sha} is not successful (${conclusion:-unknown}). ${html_url}"
            exit 1
          fi

      # ── 5. Setup tools ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ── 6. Set release version on develop, merge to main ───────────────
      - name: Apply release version on develop
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/set-release-version.mjs "${VERSION}"
          # `uv lock` keeps every pinned dependency, so the release ships what
          # CI tested, and records the new version.
          (cd apps/cli && uv lock)
          (cd packages/schemas && uv lock)

      - name: Compile changelog fragments
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          # Groups changelog.d fragments under the new version in CHANGELOG.md
          # and deletes them. With no fragments this is a no-op for the
          # changelog (purely technical release); the release body falls back
          # to a placeholder later, when extracted from CHANGELOG.md on main.
          node scripts/build-release-notes.mjs "${VERSION}" --write
          git add CHANGELOG.md changelog.d
          git status --short -- CHANGELOG.md changelog.d || true

      - name: Commit release version on develop
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          git add \
            package.json \
            apps/api/package.json \
            apps/blog/package.json \
            apps/docs/package.json \
            apps/web/package.json \
            apps/cli/package.json \
            apps/cli/pyproject.toml \
            apps/cli/uv.lock \
            packages/api-client/package.json \
            packages/devops/package.json \
            packages/schemas/package.json \
            packages/schemas/pyproject.toml \
            packages/schemas/uv.lock \
            helm/classifyre/Chart.yaml

          git commit -m "chore(release): v${VERSION}"

      - name: Merge develop into main
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          # -X theirs auto-resolves version file conflicts in develop's favor
          # (develop has the release version we just committed)
          git merge develop -X theirs --no-edit -m "chore(release): merge develop for v${{ steps.versions.outputs.version }}"

      # ── 7. Build & publish (on main) ───────────────────────────────────
      - name: Tag the release
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: git tag "${TAG}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate code
        run: bun run codegen

      - name: Generate docs artifacts
        run: bun run docs:generate

      - name: Build release artifacts
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Stage release Docker artifacts
        run: |
          bun run docs:bundle
          bash ./scripts/stage-docker-artifacts.sh "${RUNNER_TEMP}/release-artifacts"

      # Baked into the all-in-one image so a first scan embeds offline rather
      # than blocking on a Hugging Face download. Fetched here, where the
      # dependencies exist; docker/Dockerfile deliberately builds nothing.
      - name: Cache the embedding model
        working-directory: apps/api
        env:
          EMBEDDING_CACHE_DIR: ${{ runner.temp }}/release-artifacts/models
        run: bun run embedding:cache

      - name: Free disk space for release image builds
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker system prune -af || true
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release images
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail

          build_and_push() {
            local repository="$1"
            local target="$2"

            docker buildx build \
              --target "${target}" \
              --platform "${DOCKER_PLATFORMS}" \
              --push \
              --tag "${DOCKER_NAMESPACE}/${repository}:${VERSION}" \
              --tag "${DOCKER_NAMESPACE}/${repository}:latest" \
              --build-context "api-dist=${RUNNER_TEMP}/release-artifacts/api-dist" \
              --build-context "codegen=${RUNNER_TEMP}/release-artifacts/codegen" \
              --build-context "web-dist=${RUNNER_TEMP}/release-artifacts/web-dist" \
              --cache-from "type=registry,ref=${DOCKER_NAMESPACE}/${repository}:build-cache" \
              --cache-to "type=registry,ref=${DOCKER_NAMESPACE}/${repository}:build-cache,mode=max,image-manifest=true" \
              .
          }

          build_and_push "web" "web-final"
          build_and_push "api" "api-final"
          build_and_push "cli" "cli-final"

      # The all-in-one image, composed from the three just pushed. Separate step
      # because it has a different Dockerfile, context and build arguments — and
      # because it can only start once those three exist in the registry.
      - name: Build and push the all-in-one image
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx build docker \
            --file docker/Dockerfile \
            --platform "${DOCKER_PLATFORMS}" \
            --push \
            --tag "${DOCKER_NAMESPACE}/all-in-one:${VERSION}" \
            --tag "${DOCKER_NAMESPACE}/all-in-one:latest" \
            --build-arg "BASE_TAG=${VERSION}" \
            --build-arg "IMAGE_NS=${DOCKER_NAMESPACE}" \
            --build-context "models=${RUNNER_TEMP}/release-artifacts/models" \
            --build-context "iam=${GITHUB_WORKSPACE}/helm/classifyre/files/iam" \
            --cache-from "type=registry,ref=${DOCKER_NAMESPACE}/all-in-one:build-cache" \
            --cache-to "type=registry,ref=${DOCKER_NAMESPACE}/all-in-one:build-cache,mode=max,image-manifest=true"

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to Docker Hub for Helm chart publish
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io \
            --username "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Publish Helm chart to Docker Hub OCI
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          helm lint helm/classifyre
          helm package helm/classifyre
          helm push "classifyre-core-${VERSION}.tgz" "oci://registry-1.docker.io/${DOCKER_NAMESPACE}"
          echo "Published oci://registry-1.docker.io/${DOCKER_NAMESPACE}/classifyre-core:${VERSION}"

      - name: Publish classifyre-schemas to PyPI
        if: env.PYPI_TOKEN != ''
        working-directory: packages/schemas
        env:
          UV_PUBLISH_TOKEN: ${{ env.PYPI_TOKEN }}
        run: |
          uv build
          uv publish

      - name: Publish classifyre-cli to PyPI
        if: env.PYPI_TOKEN != ''
        working-directory: apps/cli
        env:
          UV_PUBLISH_TOKEN: ${{ env.PYPI_TOKEN }}
        run: |
          uv build
          uv publish

      # ── 8. Push main + tag ─────────────────────────────────────────────
      - name: Push main and release tag
        id: push
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          git push --atomic origin main "${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          # The fragments were compiled into CHANGELOG.md on develop and
          # merged here. This extracts that section as the release body, so
          # CHANGELOG.md and the GitHub Release always say the same thing.
          # (Falls back to a placeholder when the release had no fragments.)
          node scripts/build-release-notes.mjs "${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versions.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false

  # Its own job, run whenever the tag reached origin, even if a later step of
  # the release failed: "Re-run failed jobs" repeats just this.
  develop:
    name: Advance develop
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.released_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout develop (full history)
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Merge the release into develop and set the next SNAPSHOT
        env:
          TAG: ${{ needs.release.outputs.released_tag }}
          NEXT_VERSION: ${{ needs.release.outputs.next_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/advance-develop.sh "${TAG}" "${NEXT_VERSION}"

      # A push made with the workflow's token starts no workflow, so without
      # this develop would have no CI run and the next release would refuse.
      - name: Run CI on develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref develop

  deploy:
    name: Deploy the release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      HELM_RELEASE_NAME: classifyre
      HELM_NAMESPACE: classifyre
      HELM_VALUES_FILE: ./helm/develop/values-vps.yaml

    steps:
      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.released_tag }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Clear pending Helm operation
        run: |
          set -euo pipefail

          history_json="$(helm history "${HELM_RELEASE_NAME}" -n "${HELM_NAMESPACE}" -o json 2>/dev/null || true)"
          if [[ -z "${history_json}" || "${history_json}" == "[]" ]]; then
            echo "No existing Helm release state to clear."
            exit 0
          fi

          last_status="$(jq -r '.[-1].status // empty' <<< "${history_json}")"
          last_revision="$(jq -r '.[-1].revision // empty' <<< "${history_json}")"

          if [[ "${last_status}" != pending-* ]]; then
            echo "Helm release is not pending (${last_status:-unknown})."
            exit 0
          fi

          if [[ -z "${last_revision}" ]]; then
            echo "::error::Pending Helm release detected but revision could not be resolved."
            exit 1
          fi

          echo "Deleting stale Helm release secret for pending revision ${last_revision}."
          kubectl -n "${HELM_NAMESPACE}" delete secret "sh.helm.release.v1.${HELM_RELEASE_NAME}.v${last_revision}" --ignore-not-found=true

      - name: Deploy release with Helm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          helm upgrade --install "${HELM_RELEASE_NAME}" ./helm/classifyre \
            --namespace "${HELM_NAMESPACE}" \
            --create-namespace \
            -f "${HELM_VALUES_FILE}" \
            --set api.image.tag="${VERSION}" \
            --set api.cliJobs.image.tag="${VERSION}" \
            --set frontend.image.tag="${VERSION}" \
            --wait \
            --timeout 15m

      - name: Verify deployment
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          kubectl -n "${HELM_NAMESPACE}" rollout status deployment/${HELM_RELEASE_NAME}-api --timeout=300s
          kubectl -n "${HELM_NAMESPACE}" rollout status deployment/${HELM_RELEASE_NAME}-web --timeout=300s
          kubectl -n "${HELM_NAMESPACE}" get deploy,pods,svc
          helm status "${HELM_RELEASE_NAME}" -n "${HELM_NAMESPACE}"
