name: Deploy Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment / namespace"
        required: true
        default: "classifyre-develop"
        type: choice
        options:
          - classifyre-develop
          - classifyre
      image_tag:
        description: "Docker image tag to deploy (branch name, version, etc.)"
        required: false
        default: "develop"
      demo_mode:
        description: "Enable demo mode"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      keep_running:
        description: "classifyre-develop only: leave the smoke release up after the test instead of destroying it with its database."
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      environment:
        type: string
        default: "classifyre-develop"
      image_tag:
        type: string
        default: "develop"
      demo_mode:
        type: string
        default: "true"
      keep_running:
        type: string
        default: "false"
    secrets:
      DOCKER_USERNAME:
        required: true
      KUBECONFIG:
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag || 'develop' }} → ${{ inputs.environment || 'classifyre-develop' }}
    # Pinned: Playwright has no Chromium for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04

    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
      HELM_NAMESPACE: ${{ inputs.environment || 'classifyre-develop' }}
      IMAGE_TAG: ${{ inputs.image_tag || 'develop' }}
      DEMO_MODE: ${{ inputs.demo_mode || 'true' }}
      KEEP_RUNNING: ${{ inputs.keep_running || 'false' }}

    steps:
      - name: Derive environment settings
        id: env
        run: |
          set -euo pipefail
          ns="${{ env.HELM_NAMESPACE }}"
          if [[ "${ns}" == "classifyre" ]]; then
            echo "release_name=classifyre"           >> "$GITHUB_OUTPUT"
            echo "values_file=./helm/develop/values-vps.yaml" >> "$GITHUB_OUTPUT"
            echo "smoke=false"                       >> "$GITHUB_OUTPUT"
          else
            echo "release_name=classifyre-develop"   >> "$GITHUB_OUTPUT"
            echo "values_file=./helm/develop/values-vps-develop.yaml" >> "$GITHUB_OUTPUT"
            # Develop is the smoke deploy: fresh install with sign-in, the
            # Playwright smoke test, then destroyed with its database.
            echo "smoke=true"                        >> "$GITHUB_OUTPUT"
          fi

      # The commit being deployed: develop on a push there, or the branch a
      # manual run was started from.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Show deployment target
        env:
          HELM_RELEASE_NAME: ${{ steps.env.outputs.release_name }}
          HELM_VALUES_FILE: ${{ steps.env.outputs.values_file }}
        run: |
          set -euo pipefail
          echo "Namespace:   ${HELM_NAMESPACE}"
          echo "Release:     ${HELM_RELEASE_NAME}"
          echo "Values file: ${HELM_VALUES_FILE}"
          echo "Image tag:   ${IMAGE_TAG}"
          echo "API image:   ${DOCKER_NAMESPACE}/api:${IMAGE_TAG}"
          echo "Web image:   ${DOCKER_NAMESPACE}/web:${IMAGE_TAG}"
          echo "CLI image:   ${DOCKER_NAMESPACE}/cli:${IMAGE_TAG}"
          echo "Demo mode:   ${DEMO_MODE}"

      # The node is shared with prod and has run out of disk before (a full
      # image pull evicts everything). Stop before pulling more images.
      - name: Check free disk on the node
        if: steps.env.outputs.smoke == 'true'
        run: |
          set -euo pipefail
          node="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          free="$(kubectl get --raw "/api/v1/nodes/${node}/proxy/stats/summary" \
            | jq '[.node.fs.availableBytes, (.node.runtime.imageFs.availableBytes // .node.fs.availableBytes)] | min')"
          echo "Free on ${node}: $((free / 1024 / 1024 / 1024)) GiB"
          if (( free < 12 * 1024 * 1024 * 1024 )); then
            echo "::error::Less than 12 GiB free on ${node}; not deploying the smoke release next to prod."
            exit 1
          fi

      # Every smoke run starts from an empty database, also after a failed
      # run that never reached the destroy step.
      - name: Destroy the previous smoke release
        if: steps.env.outputs.smoke == 'true'
        env:
          NS: ${{ env.HELM_NAMESPACE }}
          RELEASE: ${{ steps.env.outputs.release_name }}
        run: bash scripts/smoke/destroy.sh

      - name: Clear pending Helm operation
        env:
          HELM_RELEASE_NAME: ${{ steps.env.outputs.release_name }}
        run: |
          set -euo pipefail

          history_json="$(helm history "${HELM_RELEASE_NAME}" -n "${HELM_NAMESPACE}" -o json 2>/dev/null || true)"
          if [[ -z "${history_json}" || "${history_json}" == "[]" ]]; then
            echo "No existing Helm release state to clear."
            exit 0
          fi

          last_status="$(jq -r '.[-1].status // empty' <<< "${history_json}")"
          last_revision="$(jq -r '.[-1].revision // empty' <<< "${history_json}")"

          if [[ "${last_status}" != pending-* ]]; then
            echo "Helm release is not pending (${last_status:-unknown})."
            exit 0
          fi

          if [[ -z "${last_revision}" ]]; then
            echo "::error::Pending Helm release detected but revision could not be resolved."
            exit 1
          fi

          echo "Deleting stale Helm release secret for pending revision ${last_revision}."
          kubectl -n "${HELM_NAMESPACE}" delete secret "sh.helm.release.v1.${HELM_RELEASE_NAME}.v${last_revision}" --ignore-not-found=true

      - name: Deploy with Helm
        env:
          HELM_RELEASE_NAME: ${{ steps.env.outputs.release_name }}
          HELM_VALUES_FILE: ${{ steps.env.outputs.values_file }}
        run: |
          set -euo pipefail

          helm upgrade --install "${HELM_RELEASE_NAME}" ./helm/classifyre \
            --namespace "${HELM_NAMESPACE}" \
            --create-namespace \
            -f "${HELM_VALUES_FILE}" \
            --set api.image.repository="${DOCKER_NAMESPACE}/api" \
            --set api.image.tag="${IMAGE_TAG}" \
            --set api.cliJobs.image.repository="${DOCKER_NAMESPACE}/cli" \
            --set api.cliJobs.image.tag="${IMAGE_TAG}" \
            --set frontend.image.repository="${DOCKER_NAMESPACE}/web" \
            --set frontend.image.tag="${IMAGE_TAG}" \
            --set-string api.env.DEMO_MODE="${DEMO_MODE}" \
            --wait \
            --timeout 15m

      - name: Force rollouts
        if: steps.env.outputs.smoke != 'true'
        env:
          HELM_RELEASE_NAME: ${{ steps.env.outputs.release_name }}
        run: |
          set -euo pipefail
          for deployment in api web; do
            echo "Forcing rollout for ${HELM_RELEASE_NAME}-${deployment}"
            kubectl -n "${HELM_NAMESPACE}" rollout restart deployment/"${HELM_RELEASE_NAME}-${deployment}"
            kubectl -n "${HELM_NAMESPACE}" rollout status deployment/"${HELM_RELEASE_NAME}-${deployment}" --timeout=10m
          done

      - name: Wait for staging to answer
        if: steps.env.outputs.smoke == 'true'
        run: |
          set -euo pipefail
          for url in "${SMOKE_URL}/" "${SMOKE_URL}/iam/realms/classifyre/.well-known/openid-configuration"; do
            for _ in $(seq 1 60); do
              code="$(curl -s -o /dev/null -w '%{http_code}' -m 10 "${url}" || true)"
              case "${code}" in 2*|3*) break ;; esac
              sleep 5
            done
            echo "${url} -> ${code}"
            case "${code}" in 2*|3*) ;; *) echo "::error::${url} never answered"; exit 1 ;; esac
          done
        env:
          SMOKE_URL: https://staging.classifyre.com

      # The API gives the first tenant's `admins` group Tenant admin once the
      # realm setup job has made it; the smoke admin needs that to create a
      # workspace.
      - name: Wait for the sign-in tenants
        if: steps.env.outputs.smoke == 'true'
        env:
          HELM_RELEASE_NAME: ${{ steps.env.outputs.release_name }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if kubectl -n "${HELM_NAMESPACE}" logs deploy/"${HELM_RELEASE_NAME}-api" --tail=-1 2>/dev/null \
              | grep -q "Sign-in tenants are set up"; then
              echo "Sign-in tenants are set up"; exit 0
            fi
            sleep 10
          done
          echo "::error::The API never set up the sign-in tenants"; exit 1

      - name: Seed the smoke run
        if: steps.env.outputs.smoke == 'true'
        env:
          NS: ${{ env.HELM_NAMESPACE }}
          RELEASE: ${{ steps.env.outputs.release_name }}
          BASE_URL: https://staging.classifyre.com
        run: bash scripts/smoke/seed.sh

      - name: Setup Bun
        if: steps.env.outputs.smoke == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install the smoke test
        if: steps.env.outputs.smoke == 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --filter @classifyre/e2e
          cd apps/e2e && bunx playwright install --with-deps chromium

      - name: Run the smoke test
        if: steps.env.outputs.smoke == 'true'
        working-directory: apps/e2e
        run: bunx playwright test

      - name: Upload the smoke report
        if: always() && steps.env.outputs.smoke == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14

      - name: Show the release on failure
        if: failure() && steps.env.outputs.smoke == 'true'
        env:
          HELM_RELEASE_NAME: ${{ steps.env.outputs.release_name }}
        run: |
          kubectl -n "${HELM_NAMESPACE}" get pods,jobs || true
          for name in api worker web iam; do
            echo "::group::${name} logs"
            kubectl -n "${HELM_NAMESPACE}" logs deploy/"${HELM_RELEASE_NAME}-${name}" --tail=150 --all-containers || true
            echo "::endgroup::"
          done

      - name: Destroy the smoke release with its database
        if: always() && steps.env.outputs.smoke == 'true' && env.KEEP_RUNNING != 'true'
        env:
          NS: ${{ env.HELM_NAMESPACE }}
          RELEASE: ${{ steps.env.outputs.release_name }}
        run: bash scripts/smoke/destroy.sh

      - name: Show rollout status
        if: steps.env.outputs.smoke != 'true' || env.KEEP_RUNNING == 'true'
        env:
          HELM_RELEASE_NAME: ${{ steps.env.outputs.release_name }}
        run: |
          set -euo pipefail
          kubectl -n "${HELM_NAMESPACE}" get deploy,pods,svc
          helm status "${HELM_RELEASE_NAME}" -n "${HELM_NAMESPACE}"
