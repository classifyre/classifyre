apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: classifyre

profiles:
  - name: dev
    activation:
      # An explicit `--profile` does not suppress auto-activation, so without
      # the env guard this profile would also activate during a dev-vps-db run
      # and the two `classifyre` releases would fight over the deploy config.
      # start-vps-db.sh sets CLASSIFYRE_VPS_DB_HOST; start.sh does not.
      - kubeContext: k3d-classifyre
        env: CLASSIFYRE_VPS_DB_HOST=
    deploy:
      helm:
        releases:
          - name: classifyre
            chartPath: helm/classifyre
            namespace: classifyre-dev
            createNamespace: true
            valuesFiles:
              - helm/develop/values-dev.yaml
            skipBuildDependencies: true
            wait: false

    portForward:
      - resourceType: service
        resourceName: classifyre-api
        namespace: classifyre-dev
        port: 8000
        localPort: 8811
      - resourceType: service
        resourceName: classifyre-postgres
        namespace: classifyre-dev
        port: 5432
        localPort: 5555

  # Sign-in on top of `dev`: CLASSIFYRE_IAM=true ./scripts/dev/start.sh.
  # Listed after `dev` so its patches apply to the release `dev` defines.
  # The browser reaches the identity server through the ingress
  # (http://classifyre.localhost:8080/iam, routed to the web app's
  # `/iam/[...path]` proxy). The local web server (`scripts/dev/web-iam.sh`)
  # reaches it over the port-forward below, since the in-cluster DNS name
  # only resolves inside the cluster.
  - name: iam
    activation:
      - env: CLASSIFYRE_IAM=true
    patches:
      - op: add
        path: /deploy/helm/releases/0/valuesFiles/-
        value: helm/develop/values-dev-iam.yaml
      - op: add
        path: /portForward/-
        value:
          resourceType: service
          resourceName: classifyre-iam
          namespace: classifyre-dev
          port: 8080
          localPort: 8280

  # Same local cluster, but writable and pointed at the VPS demo instance's
  # database — so the public instance can stay in read-only demo mode while you
  # create sources and change settings for it. Deployed into its own namespace
  # so it cannot collide with a plain `dev` release.
  #
  # Do not run directly: scripts/dev/start-vps-db.sh opens the database tunnel
  # and exports the values the templates below read.
  - name: dev-vps-db
    deploy:
      helm:
        releases:
          - name: classifyre
            chartPath: helm/classifyre
            namespace: classifyre-vps-db
            createNamespace: true
            valuesFiles:
              - helm/develop/values-dev.yaml
              - helm/develop/values-dev-vps-db.yaml
            setValueTemplates:
              postgres.external.host: "{{.CLASSIFYRE_VPS_DB_HOST}}"
              postgres.external.password: "{{.CLASSIFYRE_VPS_DB_PASSWORD}}"
              api.env.CLASSIFYRE_AUTO_MIGRATE: "{{.CLASSIFYRE_VPS_AUTO_MIGRATE}}"
            skipBuildDependencies: true
            wait: false

    portForward:
      - resourceType: service
        resourceName: classifyre-web
        namespace: classifyre-vps-db
        port: 3000
        localPort: 3302
      - resourceType: service
        resourceName: classifyre-api
        namespace: classifyre-vps-db
        port: 8000
        localPort: 8812
