apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-seed
data:
  seed.sql: |
{{ .Files.Get "seed.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-postgres
      annotations:
        # A changed seed starts a fresh database (nothing is persisted).
        checksum/seed: {{ .Files.Get "seed.sql" | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.password | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.username | quote }}, "-d", {{ .Values.database | quote }}]
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: seed
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: seed
          configMap:
            name: {{ .Release.Name }}-seed
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
