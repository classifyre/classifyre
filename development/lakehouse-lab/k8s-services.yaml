# Cluster names for the lakehouse lab containers (compose.yaml), so scan pods
# reach them as http://lab-<name>.classifyre-dev.svc:<port>.
#
# Not part of the Helm chart and not deployed by `skaffold dev`; apply by hand:
#   kubectl --context k3d-classifyre apply -f showcases/lakehouse-lab/k8s-services.yaml
#
# Each Service has no selector and a hand-written Endpoints object pointing at the
# container's fixed address on the k3d-classifyre Docker network.
---
apiVersion: v1
kind: Service
metadata: {name: lab-s3, namespace: classifyre-dev}
spec:
  ports: [{name: s3, port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: Endpoints
metadata: {name: lab-s3, namespace: classifyre-dev}
subsets: [{addresses: [{ip: 172.19.10.10}], ports: [{name: s3, port: 9000}]}]
---
